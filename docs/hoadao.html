<title>Hoa Đào Rơi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap">
<style>
    /* Layout: mô phỏng màn hình live bên trái, bảng chỉnh bên phải; lớp canvas hoa rơi phủ toàn trang */
    :root {
        --bg: #0a1413;
        --surface: #101e1d;
        --surface-2: #152928;
        --line: #234440;
        --fg: #e8f4f1;
        --muted: #8fa9a5;
        --accent: #2dd4bf;
        --accent-ink: #04211e;
        --blossom: #ff8fab;
        --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        line-height: 1.5;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 28px 56px;
    }

    .wrap {
        max-width: 1040px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }

    header {
        margin-bottom: 24px;
    }

    h1 {
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
        text-wrap: balance;
    }

    h1 span {
        color: var(--blossom);
    }

    .lede {
        color: var(--muted);
        margin: 0;
        max-width: 60ch;
    }

    .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 340px);
        gap: 20px;
        align-items: start;
    }

    @media (max-width: 820px) {
        .grid {
            grid-template-columns: minmax(0, 1fr);
        }
    }

    h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 12px;
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
    }

    /* mô phỏng màn hình live */
    .mock {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .live-top {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
    }

    .pill {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
    }

    .pill.live {
        color: var(--accent);
        border-color: #1d6b62;
        background: #0d2b28;
        letter-spacing: 0.06em;
    }

    .pill.live::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 7px;
    }

    .count {
        font-size: 2.4rem;
        font-weight: 800;
        line-height: 1;
    }

    .count small {
        font-size: 1.2rem;
        color: var(--muted);
        font-weight: 500;
    }

    .bar {
        height: 8px;
        border-radius: 99px;
        background: linear-gradient(90deg, #2dd4bf, #10d98a);
    }

    .checkin {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        background: var(--surface-2);
        border: 1px solid #1d5a53;
        border-radius: 14px;
        padding: 12px 14px;
    }

    .checkin b {
        color: var(--accent);
        display: block;
    }

    .checkin span {
        font-size: 0.85rem;
        color: var(--muted);
    }

    .btn {
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        border-radius: 999px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
    }

    .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
    }

    .btn:focus-visible,
    input:focus-visible,
    select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .tile {
        position: relative;
        aspect-ratio: 4 / 5;
        max-width: 230px;
        border-radius: 16px;
        border: 1px solid #1d5a53;
    }
